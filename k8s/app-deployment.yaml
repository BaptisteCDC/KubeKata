apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubekata-app
  labels:
    app: kubekata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubekata
  template:
    metadata:
      labels:
        app: kubekata
    spec:
      containers:
      - name: kubekata-app
        image: kubekata-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: kubekata-service
spec:
  type: NodePort
  selector:
    app: kubekata
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30080
