apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubekata-worker
  namespace: default
  labels:
    app: kubekata-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubekata-worker
  template:
    metadata:
      labels:
        app: kubekata-worker
    spec:
      containers:
      - name: kubekata-worker
        image: kubekata-worker:latest
        imagePullPolicy: Never
        env:
        - name: RabbitMQ__Host
          value: "rabbitmq.queue.svc.cluster.local"
        - name: RabbitMQ__User
          value: "user"
        - name: RabbitMQ__Password
          value: "password"
        ports:
        - name: metrics
          containerPort: 9464
---
apiVersion: v1
kind: Service
metadata:
  name: kubekata-worker-service
  namespace: default
  labels:
    app: kubekata-worker
spec:
  selector:
    app: kubekata-worker
  ports:
    - name: metrics
      protocol: TCP
      port: 9464
      targetPort: 9464
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubekata-worker-monitor
  namespace: monitoring
  labels:
    release: prom
spec:
  selector:
    matchLabels:
      app: kubekata-worker
  namespaceSelector:
    matchNames:
      - default
  endpoints:
  - port: metrics
    path: /metrics
    interval: 15s
