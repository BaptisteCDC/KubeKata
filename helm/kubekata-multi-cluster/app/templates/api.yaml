apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.api.name }}
  namespace: {{ .Values.global.namespace.apps }}
  labels:
    app: kubekata
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: kubekata
  template:
    metadata:
      labels:
        app: kubekata
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      {{- if .Values.governance.enabled }}
      priorityClassName: apps-high-priority
      {{- end }}
      containers:
      - name: kubekata-app
        image: {{ .Values.api.image | quote }}
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: kubekata-service
  namespace: {{ .Values.global.namespace.apps }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app: kubekata
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.api.service.port }}
      targetPort: 8080
      nodePort: {{ .Values.api.service.nodePort }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: kubekata-app-scaler
  namespace: {{ .Values.global.namespace.apps }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.api.name }}
  minReplicaCount: {{ .Values.api.scaling.minReplicas }}
  maxReplicaCount: {{ .Values.api.scaling.maxReplicas }}
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://prom-kube-prometheus-stack-prometheus.{{ .Values.global.namespace.monitoring }}.svc.cluster.local:9090
      metricName: kubekata_http_requests_total
      query: sum(rate(kubekata_http_requests_total[5m]))
      threshold: {{ .Values.api.scaling.threshold | quote }}
