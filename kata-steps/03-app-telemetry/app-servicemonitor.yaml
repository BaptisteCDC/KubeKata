apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubekata-app-monitor
  namespace: monitoring
  labels:
    release: prom # This label is often required for the operator to pick it up
spec:
  selector:
    matchLabels:
      app: kubekata
  namespaceSelector:
    matchNames:
    - default
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
