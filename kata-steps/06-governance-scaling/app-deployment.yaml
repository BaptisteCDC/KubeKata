apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubekata-app
  labels:
    app: kubekata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubekata
  template:
    metadata:
      labels:
        app: kubekata
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      priorityClassName: apps-high-priority
      containers:
      - name: kubekata-app
        image: kubekata-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: kubekata-service
  labels:
    app: kubekata
spec:
  type: NodePort
  selector:
    app: kubekata
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30080
